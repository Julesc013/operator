name: FFmpeg DV average-frame-rate validation

on:
  push:
    branches:
      - test/ffmpeg-dv-avg-frame-rate-20260726
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-fate-differential:
    name: full-fate-differential-${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: master-d09db42
            ref: d09db42d8f6b1665fb4bdbdd92f78c1e6be908f7
          - label: ffmpeg-8.1.2
            ref: n8.1.2
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3
      - name: Compare complete baseline and patched FATE failure sets
        env:
          FFMPEG_LABEL: ${{ matrix.label }}
          FFMPEG_REF: ${{ matrix.ref }}
        run: |
          chmod +x ffmpeg-dv-full-fate.sh
          ./ffmpeg-dv-full-fate.sh
      - name: Upload differential FATE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-dv-full-fate-differential-${{ matrix.label }}
          path: artifacts/full-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 30

  edge-cases:
    name: edge-cases-master-d09db42
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils pkg-config python3
      - name: Validate profile, ABI, transcode, deinterlace, and transition edges
        env:
          FFMPEG_LABEL: master-d09db42
          FFMPEG_REF: d09db42d8f6b1665fb4bdbdd92f78c1e6be908f7
        run: |
          chmod +x ffmpeg-dv-edge-validation.sh
          ./ffmpeg-dv-edge-validation.sh
      - name: Upload edge-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-dv-edge-master-d09db42
          path: artifacts/edge-master-d09db42
          if-no-files-found: warn
          retention-days: 30

  upstream-regression-test:
    name: upstream-regression-test-master-d09db42
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3
      - name: Prove test fails before and passes after the fix
        env:
          FFMPEG_LABEL: master-d09db42
          FFMPEG_REF: d09db42d8f6b1665fb4bdbdd92f78c1e6be908f7
        run: |
          chmod +x ffmpeg-dv-upstream-test-validation.sh
          ./ffmpeg-dv-upstream-test-validation.sh
      - name: Upload upstream patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-dv-upstream-test-master-d09db42
          path: artifacts/upstream-test-master-d09db42
          if-no-files-found: warn
          retention-days: 30
